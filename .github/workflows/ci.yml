name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # "build" is tsc && vite build (the prebuild hook regenerates the night list)
      - name: Type-check and build
        run: npm run build

      # After the build, so every HTML file in dist/ is checked against the CSP.
      - name: Security headers (static)
        run: npm run test:headers

      # The smoke journey against dist/, served with the same headers nginx
      # sends (CSP included), so a script the CSP blocks fails the run.
      # Uses the runner's preinstalled Chrome: no browser download.
      - name: Smoke tests under the served headers
        env:
          PORTFOLIO_URL: http://127.0.0.1:4173
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node tests/serve-dist.mjs &
          for _ in $(seq 1 30); do curl -fsS -o /dev/null "$PORTFOLIO_URL/" && break; sleep 1; done
          npm run test:lab
