name: Publish Docker image

# Builds the portfolio site for both amd64 and arm64 (UGREEN NAS models ship
# with either) and pushes to GHCR, so a NAS deployment only ever needs to
# `docker compose pull && docker compose up -d` — no build toolchain on the
# NAS itself. See deploy/README.md for the NAS-side half of this.
#
# Published from `main` only, after a merge. There is no `tags:` trigger and no
# `workflow_dispatch`, so no branch, tag or manual run can push the image
# production pulls. The job also runs in the `production` environment, whose
# deployment-branch rule is `main` only (repo Settings -> Environments); the
# `if:` below is the same restriction in the workflow itself, so it holds even
# before that environment is configured.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      # Actions are pinned to full commit SHAs, so a retagged or compromised
      # action cannot run with this job's `packages: write`. Dependabot moves
      # the pins (.github/dependabot.yml, github-actions).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/portfolio
          # Immutable per-commit tag only: no `latest` and no tag ref, so
          # nothing moving for a deploy to drift to.
          tags: |
            type=sha,format=short

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
