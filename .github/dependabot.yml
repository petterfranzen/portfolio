version: 2
updates:
  # Base images in the Dockerfile are pinned by digest; this keeps the pins
  # moving without anyone hand-editing a sha256.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
    ignore:
      # The build stage stays on the Node LTS line CI runs (ci.yml,
      # node-version: 24). Move both together, by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Keeps the SHA pins in .github/workflows/*.yml moving: Dependabot rewrites
  # the pinned commit SHA and its `# vX.Y.Z` comment together, so the publish
  # workflow never sits on a stale (or compromised) action.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1

  # vite, typescript and playwright are dev-only, but they run in the build
  # that produces the image. cooldown honours the 24 h rule for new releases.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
