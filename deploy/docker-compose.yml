# NAS-facing compose file for the portfolio site.
#
# Self-contained the same way flight-tracker's and docker-monitor's are:
# every setting is inlined as ${VAR:-default}, so pasting this one file
# into a GUI Docker app is enough.
#
# The page is static, so this stack is one independent container. It no
# longer needs docker-monitor or its network — the Lab that did is gone.

name: portfolio

services:
  portfolio:
    image: ghcr.io/petterfranzen/portfolio:${IMAGE_TAG:-latest}
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "${PORTFOLIO_PORT:-8081}:80"
    networks:
      - default
    cap_drop:
      - ALL
    cap_add:
      # nginx's entrypoint chowns its cache directories and its workers
      # drop from root to the nginx user, so these three are genuinely
      # required. With a bare `cap_drop: ALL` the container restart-loops
      # on `chown("/var/cache/nginx/client_temp") failed: Operation not
      # permitted` and never serves a request — found deploying this for
      # real, because a plain `docker run` (no cap_drop) is what local
      # testing had used.
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
