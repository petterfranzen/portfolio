# Static file serving for the five-act portfolio. No API proxy: the page makes
# no runtime calls, and the nightly experiment list is baked in at build time.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Five acts, one document: every act lives at a hash on index.html.
    location / {
        try_files $uri /index.html;
    }

    # The prose page is a second, real document under its own directory.
    location = /how-this-was-built {
        return 301 /how-this-was-built/;
    }
    location /how-this-was-built/ {
        try_files $uri /how-this-was-built/index.html;
    }

    # Vite fingerprints everything under /assets/, so it can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Captures and the favicon change rarely but are not fingerprinted.
    location ~* \.(webp|svg|png)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
