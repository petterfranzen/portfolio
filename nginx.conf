# Serves the static site. It is the whole container's job now: the Lab's
# /lab-api/ proxy to docker-monitor is gone (docs/DECISIONS.md, 2026-11-01 in
# agent-manager), because on the Hetzner VM the site is the only thing behind
# this nginx and a container-control API has no business being on a public box.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Plain-text liveness for the VM's deploy sync and for anything in front of
    # it. No version, no hostname: nothing to fingerprint.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
