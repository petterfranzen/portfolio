# Static file serving for the five-act portfolio. No API proxy: the page makes
# no runtime calls, and the nightly experiment list is baked in at build time.
#
# Security headers live in security-headers.conf (modeled on
# flight.pastabake.cloud). nginx stops inheriting add_header the moment a block
# declares one of its own, so every block below that sets Cache-Control
# re-includes the snippet. HSTS is absent on purpose - it is a Cloudflare
# toggle, not this container's job.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Single page: every act lives at a hash on index.html.
    location / {
        try_files $uri /index.html;
    }

    # Vite fingerprints everything under /assets/, so it can be cached hard.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Captures and the favicon change rarely but are not fingerprinted.
    location ~* \.(webp|svg|png)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }
}
