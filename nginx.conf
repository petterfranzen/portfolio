# Serves the static site, and fronts docker-monitor's control API at
# /lab-api/ so the Lab dashboard is same-origin (see src/lab.ts).
#
# This proxy is load-bearing for more than convenience. docker-monitor is
# never published to the internet itself — it only listens where this can
# reach it — so this is the single door in, and it's what makes
# TRUST_PROXY_HEADERS safe to enable over there: the X-Forwarded-For set
# below is written by nginx, not by the client, which is what the
# monitor's per-IP guest limits are counted against.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /lab-api/ {
        # Trailing slash on both sides: /lab-api/api/projects reaches
        # docker-monitor as /api/projects.
        proxy_pass http://docker-monitor:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Deliberately $remote_addr, NOT $proxy_add_x_forwarded_for: the
        # latter appends to whatever the client sent, so a visitor could
        # prepend a forged address and be rate-limited as someone else.
        # This is the only place the monitor's idea of "who is calling"
        # comes from.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The /api/events SSE stream pushes on change and heartbeats every
        # 15s. Buffering would hold events until the buffer filled (i.e.
        # forever, at this volume), and the default 60s read timeout would
        # drop the connection between heartbeats on a quiet host.
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
