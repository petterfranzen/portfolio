# Security headers for the portfolio, served on every response. Values are
# modeled on what flight.pastabake.cloud serves, with two deliberate changes:
# the five-act page has a single inline boot script in index.html (theme +
# no-flash, before first paint), so its sha256 is pinned in script-src; and
# connect-src is trimmed to 'self' because the portfolio makes no runtime
# calls (flight's tile origin, tiles.openfreemap.org, is not used here). That
# hash is kept honest by tests/security-headers.spec.mjs.
#
# HSTS is intentionally NOT set here: it is a Cloudflare edge toggle, not a
# response header this container should own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-CAJPUcudHg7GKnhPKasUNaCGQGZ81P+xZmU37p48mS8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; font-src 'self'" always;
