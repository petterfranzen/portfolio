# Security headers for the portfolio, served on every response. Values are
# modeled on what flight.pastabake.cloud serves, with two deliberate changes:
# script-src is 'self' alone, with no inline hashes: the theme + no-flash boot
# script both pages run before first paint is the same-origin /boot.js, so a
# new page or an edited script can't be blocked by a stale hash; and
# connect-src is trimmed to 'self' because the portfolio makes no runtime
# calls (flight's tile origin, tiles.openfreemap.org, is not used here).
# tests/security-headers.spec.mjs fails if any page grows an inline script
# that script-src would block.
#
# frame-src allows the nightly apps on GitHub Pages and nothing else: act 4's
# "Play preview" mounts one in an iframe (src/filmstrip.ts). Without it,
# default-src 'self' blocks the preview. COOP and CORP keep other origins from
# holding a window reference to this page or embedding its files.
#
# HSTS is intentionally NOT set here: it is a Cloudflare edge toggle, not a
# response header this container should own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src https://petterfranzen.github.io; worker-src 'self' blob:; manifest-src 'self'; font-src 'self'; upgrade-insecure-requests" always;
